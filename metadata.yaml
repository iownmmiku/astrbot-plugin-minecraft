name: astrbot_plugin_minecraft
display_name: Minecraft 机器人游玩
short_desc: 让 AstrBot 机器人以玩家身份进服游玩 Minecraft（双向聊天、移动、挖掘、跟随、LLM 自主驱动）
desc: |
  让 AstrBot 的机器人以真实游戏客户端身份进入 Minecraft 服务器「游玩」：

  - 双向聊天桥：QQ 群聊 ↔ 游戏内聊天实时互通（`/mc 订阅`）
  - 真实进服：机器人登录进服，可移动、挖掘、看向、跟随玩家
  - LLM 自主驱动：注册 mc_status / mc_move / mc_mine / mc_follow / mc_look / mc_chat / mc_players
    七个工具，AI 能自主决定「去哪里、挖什么、说什么」
  - 服务器双模式：一键自建本地 Paper 1.20.1 服务器（自动下载/起服/崩溃重启），
    或填写远程服务器地址直连
  - 断线自动重连，插件卸载优雅退出

  技术栈：纯 Python + mcproto 协议库（零 Node 依赖），目标协议 Minecraft 1.20.1 (protocol 763)。
  注意：机器人以离线（非正版）账号进服，仅支持未开启正版验证的服务器。
version: 0.3.0
author: iownmmiku
repo: https://github.com/iownmmiku/astrbot_plugin_minecraft
astrbot_version: ">=4.17,<5"
support_platforms: []
tags:
  - Minecraft
  - 游戏
  - 聊天桥接
  - LLM工具
  - 机器人

# 配置项定义
configs:
  - name: bot_username
    type: string
    default: AstrBot
    desc: 机器人进服时的游戏内玩家名（离线账号）
    
  - name: server_host
    type: string
    default: localhost
    desc: 服务器地址（留空使用本地服务器）
    
  - name: server_port
    type: number
    default: 25565
    desc: 服务器端口
    
  - name: use_local_server
    type: boolean
    default: true
    desc: 使用本地 Paper 服务器（自动下载/启动）
    
  - name: auto_reconnect
    type: boolean
    default: true
    desc: 断线自动重连
    
  - name: use_astrbot_config
    type: boolean
    default: true
    desc: 使用 AstrBot 全局配置（人格和模型）
    
  - name: use_astrbot_persona
    type: boolean
    default: true
    desc: 使用 AstrBot 全局人格配置（禁用后使用下方的插件人格）
    
  - name: persona
    type: select
    default: ""
    desc: 插件人格（仅当不使用 AstrBot 全局人格时生效）
    options:
      - value: ""
        label: （使用 AstrBot 全局配置）
      - value: maid
        label: 女仆（礼貌温柔）
      - value: tsundere
        label: 傲娇（外冷内热）
      - value: energetic
        label: 元气（活泼开朗）
      - value: calm
        label: 冷静（理性分析）
      - value: cheerful
        label: 开朗（阳光积极）
    
  - name: llm_model
    type: string
    default: ""
    desc: LLM 模型名称（留空使用 AstrBot 全局配置的默认模型）
    
  - name: persona_custom_desc
    type: text
    default: ""
    desc: 自定义人格描述（高级选项，留空使用预设人格）
    
  - name: enable_goal_system
    type: boolean
    default: false
    desc: 启用目标系统（让机器人自主游玩：砍树→挖矿→建造→探索）
    
  - name: enable_ambient_behaviors
    type: boolean
    default: true
    desc: 启用环境行为（空闲时随机走动、说话、跳跃、四处张望）
    
  - name: launcher_api_enabled
    type: boolean
    default: false
    desc: 启用启动器 API（与 AstrBot MC Launcher 集成）
    
  - name: launcher_api_url
    type: string
    default: http://localhost:25566
    desc: 启动器 API 地址
